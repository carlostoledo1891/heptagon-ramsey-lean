    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Opus 5.5 sessions under the author's direction wrote the Lean proofs on top
        of OpenAI's development (Lean 4, Mathlib, lake build, #print axioms), the check
        scripts, the module-system port, this packaging and the documentation; the
        builds and kernel checks ran on a rented 8-vCPU Linux machine. Exact
        computer-algebra and Python checks were used while exploring.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "a desktop machine and a rented 8-vCPU Linux machine (RunPod) for the builds and checks"
      prompting_notes: >-
        Written task briefs with hard rules: no weakened statement, no added hypothesis,
        the standard axioms only, no sorry or native_decide, statements copied verbatim
        and checked by script, every check recorded with its tool and version.
  spend_usd: "not tracked"
  notes: >-
    Carlos Toledo directed the work and made every release decision; the Lean was
    written by Claude (Anthropic's AI model) under his direction. The mathematics is
    Pálvölgyi's (with ChatGPT, as his paper states) and OpenAI's.

fidelity:
  divergences: >-
    IsRamsey is formal-conjectures' definition, verbatim, with Mathlib's Congruent (a
    distance-preserving map from A); it requires A to be finite, ranges over every number
    of colours k ≥ 1, and allows the dimension d = 0, which the proof handles. Cospherical
    is Mathlib's EuclideanGeometry.Cospherical (some centre and radius at which every
    point lies). The seven points are written as in Theorem 1 with j(2r − j) evaluated
    (2r − 1, 3(2r − 3), 4(2r − 4)); Mathlib's √ is Real.sqrt, and every radicand is
    positive for r > 2. "On the circle (x − r)² + y² = r²" is membership in
    Metric.sphere (r, 0) r. In Theorem A.3, p(t) is written out as
    ((1 − t²)/(1 + t²), 2t/(1 + t²)); "t1, t2, t3 distinct" is injectivity of
    ![t 0, t 1, t 2]; K = Q(t1, t2, t3) is IntermediateField.adjoin ℚ {t 0, t 1, t 2}
    in ℝ; Lean indices are the paper's minus one; the "almost every" clause is
    omitted. In the corollary, "on the unit circle" is membership in Metric.sphere 0 1.
    No other divergence is known.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Machine checks only (CHECKS-PALOMAR.md; for version 1.0.0, CHECKS.md): the build;
    the toolchain's lake comparator judging exports of Challenge and Solution, with six
    negative controls refused for their stated reasons; Lean's kernel, the paranoid
    checker, NanoDa, con-ron, con-leche and lean4lean on the exported proof; a
    two-computation axiom audit; scripts comparing the copied statements with
    formal-conjectures' text. No human expert has refereed the statements or the proofs.

alignment:
  namespace: "HeptagonRamsey.Heptagon"
  statements:
    - source: "arXiv:2609.23327, Theorem 1"
      lean: "HeptagonRamsey.Heptagon.heptagon_counterexample"
      module: "Challenge (statement); HeptagonRamsey.Heptagon.Statement (proof)"
      status: "proved"
      note: "Hypotheses as printed: r > 2 and r transcendental over ℚ. Both conclusions (on the circle; not Ramsey)."
    - source: "formal-conjectures erdos_174.variants.graham (negated, as in PR #7706); the conjecture of EGMRSS 1973"
      lean: "HeptagonRamsey.Heptagon.graham_false'"
      module: "Challenge (statement); HeptagonRamsey.Heptagon.Transport (proof)"
      status: "proved"
      note: "Token for token PR #7706's statement, with IsRamsey qualified as Erdos174.IsRamsey."
    - source: "arXiv:2609.23327, appendix, Theorem A.3 (the first sentence; the 'almost every' clause is not formalized)"
      lean: "HeptagonRamsey.Generic.generic_seven_not_isRamsey"
      module: "Challenge (statement); HeptagonRamsey.Generic.Statement (proof)"
      status: "proved"
      note: "Hypotheses as printed: t1, t2, t3 distinct; t4, ..., t7 algebraically independent over Q(t1, t2, t3)."
    - source: "Theorem A.3 for seven parameters algebraically independent over Q, in the shape of OpenAI's nine_circle_configuration"
      lean: "HeptagonRamsey.Generic.seven_circle_configuration_isRamsey"
      module: "Challenge (statement); HeptagonRamsey.Generic.Statement (proof)"
      status: "proved"
      note: "The hypotheses of A.3 follow from algebraic independence over Q (Mathlib's AlgebraicIndependent.adjoin_of_disjoint)."

