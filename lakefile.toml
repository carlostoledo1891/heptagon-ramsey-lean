name = "HeptagonRamsey"
version = "1.1.0"
defaultTargets = ["OAI", "HeptagonRamsey", "Challenge", "Solution"]

# openai/math's package sets autoImplicit = false; so does this one.
leanOptions = { autoImplicit = false }

# Pinned to a full commit SHA: Mathlib tag v4.35.0-rc2 (the PalomarTemplate pin).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# The 16-module import closure of this proof in openai/math 4eaee875 (EuclideanRamsey and
# SphericalRamsey), ported to the module system by header-only changes (Apache-2.0; see NOTICE and
# docs/PORT-LOG.md).
[[lean_lib]]
name = "OAI"
globs = ["OAI.Combinatorics.EuclideanRamsey.+", "OAI.Combinatorics.SphericalRamsey.+"]

# The proofs: the heptagon (Pálvölgyi's Theorem 1) and the transport to formal-conjectures'
# statement, and Theorem A.3 of the appendix with OpenAI's seven-point form.
[[lean_lib]]
name = "HeptagonRamsey"
roots = ["HeptagonRamsey"]
globs = ["HeptagonRamsey", "HeptagonRamsey.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
